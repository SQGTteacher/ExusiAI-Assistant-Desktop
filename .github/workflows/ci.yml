name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build original ClassIsland runtime
        working-directory: third_party/ClassIsland
        run: dotnet build ClassIsland.Desktop/ClassIsland.Desktop.csproj --configuration Release -p:PublishBuilding=true -p:PublishPlatform=windows -p:ClassIsland_PlatformTarget=x64
      - name: Restore
        run: dotnet restore ExusiAI.sln
      - name: Build
        run: dotnet build ExusiAI.sln --no-restore --configuration Release -p:BuildNumber=${{ github.run_number }} -p:EnableClassIslandNative=true
      - name: Test
        run: dotnet test ExusiAI.sln --no-build --configuration Release
