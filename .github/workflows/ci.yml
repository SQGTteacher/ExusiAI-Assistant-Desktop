name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore
        run: dotnet restore ExusiAI.sln
      - name: Build
        run: dotnet build ExusiAI.sln --no-restore --configuration Release -p:BuildNumber=${{ github.run_number }} -p:EnableClassIslandNative=true
      - name: Verify ClassIsland startup inside WPF
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts/classisland-build"
          $app = Join-Path $PWD "src/ExusiAI.Desktop/bin/Release/net8.0-windows/ExusiAI.Desktop.exe"
          $process = Start-Process $app -ArgumentList @("--verify-classisland", "`"$output`"") -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw "ClassIsland startup verification timed out" }
          if (Test-Path "$output/failure.txt") { Get-Content "$output/failure.txt" }
          if ($process.ExitCode -ne 0 -or !(Test-Path "$output/result.txt")) { throw "ClassIsland startup verification failed" }
          Get-Content "$output/result.txt"
      - name: Verify packaged video decoder
        shell: pwsh
        run: |
          $viewerDir = "src/ExusiAI.Desktop/bin/Release/net8.0-windows/viewer"
          foreach ($relative in @("libvlc/win-x64/libvlc.dll", "libvlc/win-x64/libvlccore.dll", "libvlc/win-x64/plugins/codec/libavcodec_plugin.dll", "licenses/LibVLC-LGPL-2.1.txt")) {
            if (!(Test-Path (Join-Path $viewerDir $relative))) { throw "Missing viewer dependency: $relative" }
          }
          foreach ($relative in @("ExusiAI.FileViewer.BinaryOffice.dll", "b2xtranslator.dll", "licenses/b2xtranslator-BSD-3-Clause.txt", "NPOI.dll", "NPOI.ScratchPad.HWPF.dll", "ICSharpCode.SharpZipLib.dll", "BouncyCastle.Crypto.dll")) {
            if (!(Test-Path (Join-Path $viewerDir $relative))) { throw "Missing in-process Office dependency: $relative" }
          }
          # WPF supplies ConfigurationManager from its declared shared framework in framework-dependent builds.
          # Self-contained publication must include the framework DLL; native DOC tests exercise its actual loading.
          $runtime = Get-Content (Join-Path $viewerDir "ExusiAI.FileViewer.Desktop.runtimeconfig.json") -Raw | ConvertFrom-Json
          $frameworks = @($runtime.runtimeOptions.frameworks) + @($runtime.runtimeOptions.framework)
          $usesDesktopFramework = @($frameworks | Where-Object { $_ -and $_.name -eq "Microsoft.WindowsDesktop.App" }).Count -gt 0
          if (!$usesDesktopFramework -and !(Test-Path (Join-Path $viewerDir "System.Configuration.ConfigurationManager.dll"))) {
            throw "ConfigurationManager is neither packaged nor provided by a declared Windows desktop framework"
          }
          $foreignExecutables = @(Get-ChildItem $viewerDir -Recurse -File -Filter *.exe | Where-Object {
            $_.FullName -ne (Join-Path (Resolve-Path $viewerDir).Path "ExusiAI.FileViewer.Desktop.exe")
          })
          if ($foreignExecutables.Count -gt 0) { throw "Third-party executables are forbidden in the viewer package: $($foreignExecutables.FullName -join ', ')" }
      - name: Test
        run: dotnet test ExusiAI.sln --no-build --configuration Release
      - name: Verify desktop UI themes and layouts
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts/ui"
          $app = Join-Path $PWD "src/ExusiAI.Desktop/bin/Release/net8.0-windows/ExusiAI.Desktop.exe"
          $process = Start-Process $app -ArgumentList @("--verify-ui", "`"$output`"") -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw "UI verification timed out" }
          if (Test-Path "$output/failure.txt") { Get-Content "$output/failure.txt" }
          if (Test-Path "$output/bindings.log") { Get-Content "$output/bindings.log" }
          if ($process.ExitCode -ne 0 -or !(Test-Path "$output/result.txt")) { throw "UI verification failed" }
          Get-Content "$output/result.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-preview
          path: artifacts/ui
          if-no-files-found: ignore
      - name: In-process PPT, Word, PDF and video integration
        run: dotnet test tests/ExusiAI.FileViewer.Integration.Tests/ExusiAI.FileViewer.Integration.Tests.csproj --configuration Release
      - name: Publish and run self-contained viewer
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "exusiai-publish"
          $viewerDir = Join-Path $publishDir "viewer"
          New-Item $viewerDir -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $viewerDir "stale-foreign.exe") "stale package marker"
          dotnet publish src/ExusiAI.Desktop/ExusiAI.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:EnableClassIslandNative=true --output $publishDir
          if ($LASTEXITCODE -ne 0) { throw "Host and viewer publish failed" }
          $islandOutput = Join-Path $publishDir "classisland-probe"
          $island = Start-Process (Join-Path $publishDir "ExusiAI.Desktop.exe") -ArgumentList @("--verify-classisland", "`"$islandOutput`"") -PassThru
          if (!$island.WaitForExit(90000)) { $island.Kill(); throw "Published ClassIsland startup timed out" }
          if (Test-Path "$islandOutput/failure.txt") { Get-Content "$islandOutput/failure.txt" }
          if ($island.ExitCode -ne 0 -or !(Test-Path "$islandOutput/result.txt")) { throw "Published ClassIsland startup failed" }
          Get-Content "$islandOutput/result.txt"
          $allowedExecutables = @((Join-Path $publishDir "ExusiAI.Desktop.exe"), (Join-Path $viewerDir "ExusiAI.FileViewer.Desktop.exe"))
          $foreignHostExecutables = @(Get-ChildItem $publishDir -Recurse -File -Filter *.exe | Where-Object { $_.FullName -notin $allowedExecutables })
          if ($foreignHostExecutables.Count -gt 0) { throw "External executable in host publication: $($foreignHostExecutables.FullName -join ', ')" }
          if (@(Get-ChildItem $publishDir -Recurse -File -Filter "ArkPets-v3.13.1.zip.part*").Count -gt 0) { throw "Archived third-party ArkPets executables must not ship" }
          foreach ($plugin in @(@("exusiai.classisland", "ExusiAI.Plugin.ClassIsland.dll"), @("exusiai.file-viewer", "ExusiAI.Plugin.FileViewer.dll"), @("exusiai.roll-call", "ExusiAI.Plugin.RollCall.dll"), @("exusiai.ark-pets", "ExusiAI.Plugin.ArkPets.dll"))) {
            $packageDir = Join-Path $publishDir "packages/$($plugin[0])"
            foreach ($file in @("package.json", "README.md", "ExusiAI.Extension.SDK.dll", $plugin[1])) {
              if (!(Test-Path (Join-Path $packageDir $file))) { throw "Incomplete plugin package: $($plugin[0])/$file" }
            }
          }
          if (!(Test-Path (Join-Path $publishDir "packages/exusiai.classisland/NativeClassIsland/ClassIsland.Desktop.dll"))) { throw "Missing in-process ClassIsland runtime" }
          foreach ($relative in @("coreclr.dll", "hostfxr.dll", "hostpolicy.dll", "System.Private.CoreLib.dll", "PresentationFramework.dll", "System.Configuration.ConfigurationManager.dll", "System.Text.Encoding.CodePages.dll", "ExusiAI.FileViewer.BinaryOffice.dll", "b2xtranslator.dll", "NPOI.dll", "NPOI.ScratchPad.HWPF.dll", "libvlc/win-x64/libvlc.dll", "libvlc/win-x64/libvlccore.dll", "libvlc/win-x64/plugins/codec/libavcodec_plugin.dll", "licenses/LibVLC-LGPL-2.1.txt", "licenses/b2xtranslator-BSD-3-Clause.txt")) {
            if (!(Test-Path (Join-Path $viewerDir $relative))) { throw "Missing self-contained dependency: $relative" }
          }
          $foreignExecutables = @(Get-ChildItem $viewerDir -Recurse -File -Filter *.exe | Where-Object { $_.FullName -ne (Join-Path $viewerDir "ExusiAI.FileViewer.Desktop.exe") })
          if ($foreignExecutables.Count -gt 0) { throw "Foreign or stale executable in published viewer: $($foreignExecutables.FullName -join ', ')" }
          $report = Join-Path $publishDir "viewer-probe.json"
          $fixtures = (Resolve-Path "tests/ExusiAI.FileViewer.Integration.Tests/Fixtures").Path
          $process = Start-Process (Join-Path $viewerDir "ExusiAI.FileViewer.Desktop.exe") -ArgumentList @("--verify-package", "`"$fixtures`"", "`"$report`"") -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw "Published viewer probe timed out" }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Published viewer probe failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.success -or $result.checks.Count -ne 6) { throw "Incomplete published viewer probe" }
