name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Restore
        run: dotnet restore ExusiAI.sln
      - name: Build
        run: dotnet build ExusiAI.sln --no-restore --configuration Release -p:BuildNumber=${{ github.run_number }} -p:EnableClassIslandNative=true
      - name: Verify packaged video decoder
        shell: pwsh
        run: |
          $viewerDir = "src/ExusiAI.Desktop/bin/Release/net8.0-windows/viewer"
          foreach ($relative in @("libvlc/win-x64/libvlc.dll", "libvlc/win-x64/libvlccore.dll", "libvlc/win-x64/plugins/codec/libavcodec_plugin.dll", "licenses/LibVLC-LGPL-2.1.txt")) {
            if (!(Test-Path (Join-Path $viewerDir $relative))) { throw "Missing viewer dependency: $relative" }
          }
          foreach ($relative in @("ExusiAI.FileViewer.BinaryOffice.dll", "b2xtranslator.dll", "licenses/b2xtranslator-BSD-3-Clause.txt", "NPOI.dll", "NPOI.ScratchPad.HWPF.dll", "ICSharpCode.SharpZipLib.dll", "BouncyCastle.Crypto.dll")) {
            if (!(Test-Path (Join-Path $viewerDir $relative))) { throw "Missing in-process Office dependency: $relative" }
          }
          # WPF supplies ConfigurationManager from its declared shared framework in framework-dependent builds.
          # Self-contained publication must include the framework DLL; native DOC tests exercise its actual loading.
          $runtime = Get-Content (Join-Path $viewerDir "ExusiAI.FileViewer.Desktop.runtimeconfig.json") -Raw | ConvertFrom-Json
          $frameworks = @($runtime.runtimeOptions.frameworks) + @($runtime.runtimeOptions.framework)
          $usesDesktopFramework = @($frameworks | Where-Object { $_ -and $_.name -eq "Microsoft.WindowsDesktop.App" }).Count -gt 0
          if (!$usesDesktopFramework -and !(Test-Path (Join-Path $viewerDir "System.Configuration.ConfigurationManager.dll"))) {
            throw "ConfigurationManager is neither packaged nor provided by a declared Windows desktop framework"
          }
          $foreignExecutables = @(Get-ChildItem $viewerDir -Recurse -File -Filter *.exe | Where-Object {
            $_.FullName -ne (Join-Path (Resolve-Path $viewerDir).Path "ExusiAI.FileViewer.Desktop.exe")
          })
          if ($foreignExecutables.Count -gt 0) { throw "Third-party executables are forbidden in the viewer package: $($foreignExecutables.FullName -join ', ')" }
      - name: Test
        run: dotnet test ExusiAI.sln --no-build --configuration Release
      - name: In-process PPT, Word, PDF and video integration
        run: dotnet test tests/ExusiAI.FileViewer.Integration.Tests/ExusiAI.FileViewer.Integration.Tests.csproj --configuration Release
