name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ExusiAI.sln
      - name: Build
        run: dotnet build ExusiAI.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test ExusiAI.sln --no-build --configuration Release
